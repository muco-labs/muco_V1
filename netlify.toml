# Netlify production hosting for muco-labs-v1 (Vite SPA + Hono API)
# See NETLIFY_MIGRATION.md for env vars and cutover checklist.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Include server sources for the API function bundle
  included_files = ["server/**"]

# Force DEPLOY_ENV=production on production context so SEO canonicals stay on www
[context.production.environment]
  DEPLOY_ENV = "production"

[context.deploy-preview.environment]
  DEPLOY_ENV = "preview"

[context.branch-deploy.environment]
  DEPLOY_ENV = "preview"

# Apex → www (matches prior vercel.json host redirect)
[[redirects]]
  from = "https://mucolabs.com/*"
  to = "https://www.mucolabs.com/:splat"
  status = 301
  force = true

# SPA fallback — Netlify Functions with config.path=/api/* are matched before this
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache hashed Vite assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Global security headers (aligned with src/config/security.ts + prior vercel.json allowlists)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' https://www.googletagmanager.com https://checkout.razorpay.com https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; frame-src https://api.razorpay.com https://checkout.razorpay.com https://accounts.google.com https://*.firebaseapp.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://*.supabase.co wss://*.supabase.co https://api.razorpay.com https://lumberjack.razorpay.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://apis.google.com https://www.googleapis.com https:"
